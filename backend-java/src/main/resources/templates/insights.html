<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Attendance Insights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar('insights')}"></div>

<div class="container-fluid">
    <h2>Smart Attendance Insights</h2>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/insights}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Course</label>
                    <select name="course" class="form-select">
                        <option value="">All</option>
                        <option th:each="c : ${courses}" th:value="${c}" th:text="${c}" th:selected="${c == selectedCourse}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Year</label>
                    <select name="year" class="form-select">
                        <option value="">All</option>
                        <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == selectedYear}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Division</label>
                    <select name="division" class="form-select">
                        <option value="">All</option>
                        <option th:each="d : ${divisions}" th:value="${d}" th:text="${d}" th:selected="${d == selectedDivision}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Insights & Recommendations Box -->
    <div class="card mb-4 border-info">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0"><i class="bi bi-lightbulb"></i> Insights & Recommendations</h5>
        </div>
        <div class="card-body">
            <ul class="mb-0">
                <li th:each="insight : ${insights}" th:text="${insight}"></li>
                <li th:if="${#lists.isEmpty(insights)}" class="text-muted">No insights available for the selected filter.</li>
            </ul>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover bg-white border">
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Attendance %</th>
                    <th>Trend</th>
                    <th>Engagement Score</th>
                    <th>Risk Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.rollNo}"></td>
                    <td th:text="${s.name}"></td>
                    <td><span th:text="${s.attendancePercentage}"></span>%</td>
                    <td>
                        <span th:if="${s.trend == 'Improving'}" class="text-success"><i class="bi bi-arrow-up-right-circle-fill"></i> Improving</span>
                        <span th:if="${s.trend == 'Declining'}" class="text-danger"><i class="bi bi-arrow-down-right-circle-fill"></i> Declining</span>
                        <span th:if="${s.trend == 'Stable'}" class="text-secondary"><i class="bi bi-dash-circle-fill"></i> Stable</span>
                    </td>
                    <td th:text="${s.engagementScore}"></td>
                    <td>
                        <span th:if="${s.riskStatus == 'SAFE'}" class="badge bg-success">SAFE</span>
                        <span th:if="${s.riskStatus == 'WARNING'}" class="badge bg-warning text-dark">WARNING</span>
                        <span th:if="${s.riskStatus == 'CRITICAL'}" class="badge bg-danger">CRITICAL</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="6" class="text-center text-muted">No students found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
