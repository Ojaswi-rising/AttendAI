<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create New Teacher - AttendAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments :: navbar('')}"></div>

    <div class="container flex-grow-1 d-flex justify-content-center align-items-center py-4">
        <div class="card p-4 shadow-sm border-0" style="width: 100%; max-width: 480px;">
            <div class="text-center mb-4">
                <div class="mb-2 text-primary">
                    <i class="bi bi-person-badge" style="font-size: 2.5rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Create Teacher</h3>
                <p class="text-muted small">Add a new faculty account to AttendAI</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/admin/teachers/new}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="teacher@tcetmumbai.in" required autofocus>
                    <div class="form-text">Must be a valid email address.</div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
                    <div class="form-text">Must be at least 8 characters long.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-person-plus-fill me-1"></i> Create Teacher
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/admin/users}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left me-1"></i> Back to User Management
                </a>
            </div>
        </div>
    </div>
</body>
</html>
