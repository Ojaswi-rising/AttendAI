<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AttendAI - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .dashboard-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            cursor: pointer;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments :: navbar('home')}"></div>
    
    <div class="container flex-grow-1 py-4 mb-5">
        <div class="text-center mb-5 mt-3">
            <h1 class="fw-bold text-dark">Welcome to AttendAI</h1>
            <p class="text-muted fs-5">Face Recognition Based Attendance Management System</p>
        </div>

        <div class="row g-4 justify-content-center" style="max-width: 900px; margin: 0 auto;">
            <!-- Register Student -->
            <div class="col-12 col-md-6">
                <a href="/register" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 dashboard-card">
                        <div class="card-body text-center p-4">
                            <div class="mb-3 text-primary">
                                <i class="bi bi-person-plus" style="font-size: 2.5rem;"></i>
                            </div>
                            <h5 class="card-title fw-bold text-dark">Register Student</h5>
                            <p class="card-text text-muted mb-0">Add a new student with face photo</p>
                        </div>
                    </div>
                </a>
            </div>
            
            <!-- New Session -->
            <div class="col-12 col-md-6">
                <a href="/session/new" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 dashboard-card">
                        <div class="card-body text-center p-4">
                            <div class="mb-3 text-success">
                                <i class="bi bi-camera-video" style="font-size: 2.5rem;"></i>
                            </div>
                            <h5 class="card-title fw-bold text-dark">New Session</h5>
                            <p class="card-text text-muted mb-0">Start a new attendance session</p>
                        </div>
                    </div>
                </a>
            </div>
            
            <!-- Records -->
            <div class="col-12 col-md-6">
                <a href="/records" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 dashboard-card">
                        <div class="card-body text-center p-4">
                            <div class="mb-3" style="color: #2563EB;">
                                <i class="bi bi-table" style="font-size: 2.5rem;"></i>
                            </div>
                            <h5 class="card-title fw-bold text-dark">Records</h5>
                            <p class="card-text text-muted mb-0">View and export attendance history</p>
                        </div>
                    </div>
                </a>
            </div>
            
            <!-- Insights -->
            <div class="col-12 col-md-6">
                <a href="/insights" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 dashboard-card">
                        <div class="card-body text-center p-4">
                            <div class="mb-3" style="color: #0D9488;">
                                <i class="bi bi-lightbulb" style="font-size: 2.5rem;"></i>
                            </div>
                            <h5 class="card-title fw-bold text-dark">Insights</h5>
                            <p class="card-text text-muted mb-0">Smart predictions and recommendations</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
