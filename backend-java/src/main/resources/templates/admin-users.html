<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Users - AttendAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments :: navbar('')}"></div>

    <div class="container flex-grow-1 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1">User Management</h2>
                <p class="text-muted mb-0">View all users, manage account statuses, and create teachers</p>
            </div>
            <div>
                <a th:href="@{/admin/teachers/new}" class="btn btn-primary shadow-sm">
                    <i class="bi bi-person-plus-fill me-1"></i> Create New Teacher
                </a>
            </div>
        </div>

        <!-- Success/Error Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="ps-3">Email</th>
                                <th scope="col">Role</th>
                                <th scope="col">Status</th>
                                <th scope="col">Created At</th>
                                <th scope="col" class="text-end pe-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td class="ps-3 fw-medium" th:text="${user.email}"></td>
                                <td>
                                    <span th:if="${user.role.name() == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                                    <span th:if="${user.role.name() == 'TEACHER'}" class="badge bg-primary">TEACHER</span>
                                    <span th:if="${user.role.name() == 'STUDENT'}" class="badge bg-info text-dark">STUDENT</span>
                                </td>
                                <td>
                                    <span th:if="${user.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                                    <span th:if="${user.status.name() == 'DISABLED'}" class="badge bg-secondary">DISABLED</span>
                                </td>
                                <td class="text-muted" th:text="${user.createdAt != null ? user.createdAt : '-'}"></td>
                                <td class="text-end pe-3">
                                    <!-- Current logged-in admin indicator (no actions for self) -->
                                    <span th:if="${#strings.equalsIgnoreCase(user.email, #authentication.name)}" class="badge bg-light text-secondary border">Current User</span>

                                    <!-- Action buttons for other users -->
                                    <th:block th:unless="${#strings.equalsIgnoreCase(user.email, #authentication.name)}">
                                        <!-- Disable button for ACTIVE users -->
                                        <form th:if="${user.status.name() == 'ACTIVE'}" th:action="@{/admin/users/{id}/disable(id=${user.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-slash-circle me-1"></i>Disable
                                            </button>
                                        </form>

                                        <!-- Enable button for DISABLED users -->
                                        <form th:if="${user.status.name() == 'DISABLED'}" th:action="@{/admin/users/{id}/enable(id=${user.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-success">
                                                <i class="bi bi-check-circle me-1"></i>Enable
                                            </button>
                                        </form>
                                    </th:block>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="5" class="text-center text-muted py-4">No users found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
