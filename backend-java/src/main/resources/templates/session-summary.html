<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar('new_session')}"></div>

<div class="container mt-4 mb-5" style="max-width: 900px;">
    
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="card-title text-primary">Session Summary</h4>
            <div class="row mt-3">
                <div class="col-md-6 mb-2"><strong>Course:</strong> <span th:text="${attendanceSession.course}"></span></div>
                <div class="col-md-6 mb-2"><strong>Year:</strong> <span th:text="${attendanceSession.year}"></span></div>
                <div class="col-md-6 mb-2"><strong>Division:</strong> <span th:text="${attendanceSession.division}"></span></div>
                <div class="col-md-6 mb-2"><strong>Subject:</strong> <span th:text="${attendanceSession.subject}"></span></div>
                <div class="col-md-6 mb-2"><strong>Date:</strong> <span th:text="${attendanceSession.sessionDate}"></span></div>
                <div class="col-md-6 mb-2"><strong>Status:</strong> <span class="badge bg-secondary" th:text="${attendanceSession.status}"></span></div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm bg-info text-white">
                <div class="card-body text-center">
                    <h5>Total Expected</h5>
                    <h2 th:text="${totalExpected}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm bg-success text-white">
                <div class="card-body text-center">
                    <h5>Present</h5>
                    <h2 th:text="${presentCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm bg-danger text-white">
                <div class="card-body text-center">
                    <h5>Absent</h5>
                    <h2 th:text="${absentCount}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Student Attendance List</h5>
            <div class="table-responsive mt-3">
                <table class="table table-hover table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>Roll Number</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Confidence</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.rollNo}"></td>
                            <td th:text="${student.name}"></td>
                            <td>
                                <span th:if="${student.status == 'PRESENT'}" class="badge bg-success">PRESENT</span>
                                <span th:if="${student.status == 'ABSENT'}" class="badge bg-danger">ABSENT</span>
                                <span th:if="${student.status != 'PRESENT' and student.status != 'ABSENT'}" class="badge bg-secondary" th:text="${student.status}"></span>
                            </td>
                            <td>
                                <span th:if="${student.confidence != null}" th:text="${#numbers.formatDecimal(student.confidence, 1, 2)}"></span>
                                <span th:if="${student.confidence == null}" class="text-muted">-</span>
                            </td>
                        </tr>
                        <tr th:if="${students == null or students.isEmpty()}">
                            <td colspan="4" class="text-center text-muted">No students found for this session.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="mt-4 text-center">
        <a href="/" class="btn btn-outline-primary">Back to Home</a>
    </div>
    
</div>

</body>
</html>
