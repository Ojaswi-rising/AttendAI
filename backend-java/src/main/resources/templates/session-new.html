<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title text-center mb-4">Create New Session</h2>
            
            <form action="/session/new" method="post">
                <div class="mb-3">
                    <label class="form-label">Course:</label>
                    <input type="text" name="course" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Branch (Optional):</label>
                    <input type="text" name="branch" class="form-control">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Year:</label>
                    <select name="year" class="form-select" required>
                        <option value="">Select Year</option>
                        <option value="First Year">First Year</option>
                        <option value="Second Year">Second Year</option>
                        <option value="Third Year">Third Year</option>
                        <option value="Fourth Year">Fourth Year</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Division:</label>
                    <input type="text" name="division" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Subject:</label>
                    <input type="text" name="subject" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Date:</label>
                    <input type="date" name="sessionDate" class="form-control" th:value="${currentDate}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Time:</label>
                    <input type="time" name="sessionTime" class="form-control" th:value="${currentTime}" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Create Session</button>
                    <a href="/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const timeInput = document.querySelector('input[name="sessionTime"]');
        if (timeInput && !timeInput.value) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeInput.value = hours + ':' + minutes;
        }
    });
</script>
</body>
</html>
