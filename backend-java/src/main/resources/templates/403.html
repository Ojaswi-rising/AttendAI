<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied - AttendAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card p-4 p-md-5 shadow-sm border-0 text-center" style="width: 100%; max-width: 480px;">
        <div class="mb-3 text-danger">
            <i class="bi bi-shield-lock-fill" style="font-size: 3.5rem;"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Access Denied</h3>
        <p class="text-danger fw-semibold small mb-3">HTTP 403 Forbidden</p>
        
        <p class="text-muted mb-4">
            You do not have permission to view or access this page. If you require access, please contact your administrator.
        </p>

        <div class="d-flex justify-content-center gap-2">
            <!-- If student, link to student dashboard -->
            <a th:href="@{/student/dashboard}" class="btn btn-primary px-3" sec:authorize="hasRole('STUDENT') and !hasRole('TEACHER') and !hasRole('ADMIN')">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
            <!-- If teacher or admin, link to home -->
            <a th:href="@{/}" class="btn btn-primary px-3" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                <i class="bi bi-house-door-fill me-1"></i> Home
            </a>
            <!-- If unauthenticated -->
            <a th:href="@{/login}" class="btn btn-primary px-3" sec:authorize="!isAuthenticated()">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </a>

            <!-- Sign out button -->
            <form th:action="@{/logout}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-outline-secondary">
                    <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                </button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
