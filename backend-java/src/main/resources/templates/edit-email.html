<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Student Email - AttendAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments :: navbar('')}"></div>

    <div class="container flex-grow-1 d-flex justify-content-center align-items-center py-4">
        <div class="card p-4 shadow-sm border-0" style="width: 100%; max-width: 520px;">
            <div class="text-center mb-4">
                <div class="mb-2 text-primary">
                    <i class="bi bi-envelope-at" style="font-size: 2.5rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Edit Student Email</h3>
                <p class="text-muted small">Update official college email for student login</p>
            </div>

            <!-- Student Summary Box -->
            <div class="bg-light p-3 rounded mb-3 border">
                <div class="row g-2 small">
                    <div class="col-6"><strong>Name:</strong> <span th:text="${student.name}"></span></div>
                    <div class="col-6"><strong>Roll No:</strong> <span th:text="${student.rollNo}"></span></div>
                    <div class="col-6"><strong>Course:</strong> <span th:text="${student.course}"></span></div>
                    <div class="col-6"><strong>Division:</strong> <span th:text="${student.division}"></span></div>
                </div>
            </div>

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/edit-email/{id}(id=${student.id})}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">College Email</label>
                    <input type="email" id="email" name="email" class="form-control" th:value="${student.email}" placeholder="student@tcetmumbai.in" required autofocus>
                    <div class="form-text">Must be a valid @tcetmumbai.in email address.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-check2-circle me-1"></i> Update Email
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/register}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left me-1"></i> Back to Register Student
                </a>
            </div>
        </div>
    </div>
</body>
</html>
