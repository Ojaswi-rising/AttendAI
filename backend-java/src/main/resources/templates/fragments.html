<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">AttendAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:fragment="navbar(activePage)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/student/dashboard}" sec:authorize="hasRole('STUDENT') and !hasRole('TEACHER') and !hasRole('ADMIN')">AttendAI</a>
            <a class="navbar-brand fw-bold" th:href="@{/}" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">AttendAI</a>
            <a class="navbar-brand fw-bold" th:href="@{/}" sec:authorize="!isAuthenticated()">AttendAI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Admin dropdown -->
                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" th:classappend="${activePage == 'admin' or activePage == 'admin_users' or activePage == 'admin_teacher'} ? 'active' : ''" href="#" id="adminNavbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Admin
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="adminNavbarDropdown">
                            <li><a class="dropdown-item" th:href="@{/admin/users}">Users</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/teachers/new}">Add Teacher</a></li>
                        </ul>
                    </li>

                    <!-- Teacher links (visible to TEACHER and ADMIN) -->
                    <th:block sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                        <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'home'} ? 'active' : ''" th:href="@{/}">Home</a></li>
                        <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'register'} ? 'active' : ''" th:href="@{/register}">Register Student</a></li>
                        <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'new_session'} ? 'active' : ''" th:href="@{/session/new}">New Session</a></li>
                        <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'records'} ? 'active' : ''" th:href="@{/records}">Records</a></li>
                        <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'insights'} ? 'active' : ''" th:href="@{/insights}">Insights</a></li>
                    </th:block>

                    <!-- Student links (visible to STUDENT only) -->
                    <th:block sec:authorize="hasRole('STUDENT') and !hasRole('TEACHER') and !hasRole('ADMIN')">
                        <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''" th:href="@{/student/dashboard}">Dashboard</a></li>
                    </th:block>
                </ul>

                <!-- User profile & Logout -->
                <div class="d-flex align-items-center ms-auto" sec:authorize="isAuthenticated()">
                    <span class="text-light me-2 small" sec:authentication="name">user@example.com</span>
                    <span class="badge bg-danger me-3" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                    <span class="badge bg-primary me-3" sec:authorize="hasRole('TEACHER') and !hasRole('ADMIN')">TEACHER</span>
                    <span class="badge bg-success me-3" sec:authorize="hasRole('STUDENT') and !hasRole('TEACHER') and !hasRole('ADMIN')">STUDENT</span>
                    <form th:action="@{/logout}" method="post" class="d-flex m-0">
                        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                    </form>
                </div>
                <div class="d-flex align-items-center ms-auto" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Login</a>
                </div>
            </div>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
