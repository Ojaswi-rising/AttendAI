<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<div th:fragment="navbar(activePage)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">AttendAI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'home'} ? 'active' : ''" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'register'} ? 'active' : ''" href="/register">Register Student</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'new_session'} ? 'active' : ''" href="/session/new">New Session</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'records'} ? 'active' : ''" href="/records">Records</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'insights'} ? 'active' : ''" href="/insights">Insights</a></li>
                </ul>
                <form th:action="@{/logout}" method="post" class="d-flex m-0">
                    <button class="btn btn-outline-light" type="submit">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
