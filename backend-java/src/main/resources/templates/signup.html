<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Signup - AttendAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card p-4 shadow-sm border-0" style="width: 100%; max-width: 440px;">
        <div class="text-center mb-3">
            <div class="mb-2 text-primary">
                <i class="bi bi-mortarboard-fill" style="font-size: 2.5rem;"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Student Signup</h3>
            <p class="text-muted small">Register your account with your college email</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/signup}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name.roll@tcetmumbai.in" required autofocus>
                <div class="form-text">Must end with @tcetmumbai.in</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter your password" required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign Up</button>
        </form>

        <div class="text-center mt-3 pt-2 border-top">
            <a th:href="@{/login}" class="text-decoration-none small text-muted">
                Already registered? <span class="text-primary fw-semibold">Sign In</span>
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
