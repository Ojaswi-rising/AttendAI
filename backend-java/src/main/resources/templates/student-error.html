<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Account Notice - AttendAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments :: navbar('')}"></div>

    <div class="container flex-grow-1 d-flex justify-content-center align-items-center py-5">
        <div class="card p-4 p-md-5 shadow-sm border-0 text-center" style="width: 100%; max-width: 550px;">
            <div class="mb-3 text-warning">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 3.5rem;"></i>
            </div>
            <h3 class="fw-bold text-dark mb-3">Student Record Required</h3>
            
            <div class="alert alert-warning py-3 text-start" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-info-circle-fill fs-5 me-2 text-warning"></i>
                    <span class="fw-semibold" th:text="${error}">Student record not found for this account. Contact your teacher.</span>
                </div>
            </div>

            <p class="text-muted mb-4">
                Your login account is active, but your academic student profile has not been linked. Please contact your faculty or teacher to register your details and college email in AttendAI.
            </p>

            <div class="d-flex justify-content-center gap-2">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
